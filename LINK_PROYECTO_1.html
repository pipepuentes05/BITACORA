<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lámina iPhone 15 Pro Max</title>

    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            color: white;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            background: rgba(10, 10, 10, 0.95);

            border-bottom: 1px solid #252525;

            position: fixed;
            top: 0;
            left: 0;

            z-index: 100;
        }


        .titulo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }


        .titulo span {
            color: #4d9cff;
        }


        /* =========================
           BOTÓN PANTALLA COMPLETA
        ========================= */

        .boton {
            border: none;

            background: #ffffff;
            color: #000000;

            padding: 10px 18px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .boton:hover {
            background: #4d9cff;
            color: white;

            transform: translateY(-2px);
        }


        /* =========================
           CONTENEDOR
        ========================= */

        main {
            width: 100%;

            min-height: 100vh;

            padding-top: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #202020 0%,
                    #101010 50%,
                    #050505 100%
                );
        }


        /* =========================
           LÁMINA
        ========================= */

        .contenedor-lamina {
            width: 100%;

            min-height: calc(100vh - 70px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .lamina {
            display: block;

            max-width: 100%;
            max-height: calc(100vh - 110px);

            width: auto;
            height: auto;

            object-fit: contain;

            background: white;

            border-radius: 6px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6);

            transition: transform 0.3s ease;
        }


        .lamina:hover {
            transform: scale(1.01);
        }


        /* =========================
           PANTALLA COMPLETA
        ========================= */

        .fullscreen {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: #000000;

            z-index: 999;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px;
        }


        .fullscreen .lamina {
            max-width: 100vw;
            max-height: 100vh;

            border-radius: 0;

            box-shadow: none;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            header {
                height: 60px;

                padding: 0 15px;
            }


            .titulo {
                font-size: 15px;
            }


            .boton {
                padding: 8px 12px;

                font-size: 12px;
            }


            main {
                padding-top: 60px;
            }


            .contenedor-lamina {
                min-height: calc(100vh - 60px);

                padding: 10px;
            }


            .lamina {
                max-height: calc(100vh - 80px);
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BARRA SUPERIOR
    ========================== -->

    <header>

        <div class="titulo">
            PROYECTO <span>INTERFAZ</span>
        </div>


        <button
            class="boton"
            onclick="pantallaCompleta()"
        >
            Pantalla completa
        </button>

    </header>



    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->

    <main>


        <div
            class="contenedor-lamina"
            id="contenedor"
        >


            <!-- AQUÍ ESTÁ TU IMAGEN -->

            <img
                src="lamina_1.png"
                alt="Lámina iPhone 15 Pro Max - Entradas y Salidas de Interfaz"
                class="lamina"
            >


        </div>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        function pantallaCompleta() {

            const contenedor =
                document.getElementById("contenedor");


            if (!document.fullscreenElement) {

                contenedor.requestFullscreen();

                contenedor.classList.add("fullscreen");

            } else {

                document.exitFullscreen();

            }

        }



        document.addEventListener(
            "fullscreenchange",
            function () {

                const contenedor =
                    document.getElementById("contenedor");


                if (!document.fullscreenElement) {

                    contenedor.classList.remove("fullscreen");

                }

            }
        );


    </script>


</body>

</html>
